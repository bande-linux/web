name: ci
run-name: "${{ github.ref_type == 'tag' && format('Check web {0}', github.ref_name) || format('Test check of {0}', github.ref_name) }}"

on:
  push:
    tags: ['web-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  WEB_SUITES: ${{ github.workspace }}/.suites

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/cache@v6
        with:
          path: .suites
          key: suites-${{ hashFiles('tools/conformance/src/source.rs') }}
      - name: Parser conformance against the plan's baseline
        run: >
          cargo run --release --locked -p web-conformance --
          --summary "$RUNNER_TEMP/conformance.md"
          --baseline NOTES/plans/browser/roadmap.md
          html5lib-tokenizer html5lib-tree css-parsing
      - name: WPT reftests, reported only since fonts differ from the mini
        run: >
          cargo run --release --locked -p web-conformance --
          --summary "$RUNNER_TEMP/conformance.md" wpt-reftests
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/conformance.md" >> "$GITHUB_STEP_SUMMARY" || true
