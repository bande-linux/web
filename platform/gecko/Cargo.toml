[package]
name = "bande-gecko"
description = "Bande's windows and input for the browser engine, reached through a small C interface"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
bande-graphics = { git = "https://github.com/bande-linux/desktop", branch = "gap-firefox-bande-widget" }
bande-toolkit-platform = { git = "https://github.com/bande-linux/desktop", branch = "gap-firefox-bande-widget" }
rustix = { version = "=1.1.6", features = ["event", "pipe"] }
wayland-client = "=0.31.15"
zbus = "=5.19.0"

[profile.release]
codegen-units = 4
lto = "thin"
panic = "abort"
strip = true
