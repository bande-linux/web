[package]
name = "web-css-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
web-atoms = { path = "../../web-atoms" }
web-css = { path = ".." }

[[bin]]
name = "stylesheet"
path = "fuzz_targets/stylesheet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selectors"
path = "fuzz_targets/selectors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "properties"
path = "fuzz_targets/properties.rs"
test = false
doc = false
bench = false
