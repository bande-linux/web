[package]
name = "web-html-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
web-html = { path = ".." }
web-dom = { path = "../../web-dom" }

[[bin]]
name = "tokenizer"
path = "fuzz_targets/tokenizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_builder"
path = "fuzz_targets/tree_builder.rs"
test = false
doc = false
bench = false

[workspace]
