[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/bande-linux/web"

[workspace.dependencies]
web-atoms = { path = "crates/web-atoms" }
web-dom = { path = "crates/web-dom" }
web-html = { path = "crates/web-html" }
web-style = { path = "crates/web-style" }
hashbrown = { version = "0.16", default-features = false }
web-net = { path = "crates/web-net" }
brotli-decompressor = "5"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
hyper = { version = "1", features = ["client", "http1"] }
rustix = { version = "1", features = ["event", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-platform-verifier = "0.7"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = "line-tables-only"
