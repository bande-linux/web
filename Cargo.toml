[workspace]
resolver = "3"
members = ["crates/*", "tools/bench", "tools/conformance"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/bande-linux/web"

[workspace.dependencies]
web-atoms = { path = "crates/web-atoms" }
web-dom = { path = "crates/web-dom" }
web-html = { path = "crates/web-html" }
web-style = { path = "crates/web-style" }
web-text = { path = "crates/web-text" }
web-layout = { path = "crates/web-layout" }
web-paint = { path = "crates/web-paint" }
web-css = { path = "crates/web-css" }
web-content = { path = "crates/web-content" }
web-image = { path = "crates/web-image" }
web-av1 = { path = "crates/web-av1" }
web-net = { path = "crates/web-net" }
web-ipc = { path = "crates/web-ipc" }
web-renderer = { path = "crates/web-renderer" }
web-netd = { path = "crates/web-netd" }
web-host = { path = "crates/web-host" }
brotli-decompressor = "5"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
fontique = { version = "=0.12.0", features = ["fontconfig-dlopen"] }
gif = "0.14"
harfrust = "=0.12.0"
hashbrown = { version = "0.16", default-features = false }
hyper = { version = "1", features = ["client", "http1"] }
icu_properties = "2.4"
icu_segmenter = "2.4"
image-webp = "0.2"
jxl-oxide = { version = "=0.12.6", default-features = false }
landlock = "0.4.4"
libc = "0.2"
linebender_resource_handle = "0.1.1"
png = "0.18"
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rustix = { version = "1", features = ["event", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-platform-verifier = "0.7"
seccompiler = "0.5"
serde_json = "1"
skrifa = "=0.44.0"
unicode-bidi = "0.3.18"
url = "2"
vello_cpu = "=0.3.0"
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = "line-tables-only"
